# 这是模板，不要直接应用，也不要填写后提交到版本库。
#
# 推荐做法：
#   cp secret.example.yaml secret.yaml
#   编辑 secret.yaml 后，再执行 kubectl apply -f secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: nanzi-ai-agent-secret
  namespace: nanzi-ai-agent
type: Opaque
stringData:
  MYSQL_USER: "CHANGE_ME"
  MYSQL_PASSWORD: "CHANGE_ME"

  # DATABASE_TYPE=postgresql 时使用；不用的字段可以保留占位值。
  POSTGRES_USER: "CHANGE_ME"
  POSTGRES_PASSWORD: "CHANGE_ME"

  # 无密码 Redis 可填写空字符串；启用认证时填写真实密码。
  REDIS_PASSWORD: "CHANGE_ME"

  # 新环境可以直接使用这个默认值，无需另外生成；生产环境也可以替换成自己的值。
  # 一旦平台已经保存加密凭据，就必须一直使用当时的值，否则旧凭据无法解密。
  ENCRYPTION_KEY: "KkJgK_d-1Jda9CAp7iGhRDzuXLYZfnid2siBeIC5lqw="
